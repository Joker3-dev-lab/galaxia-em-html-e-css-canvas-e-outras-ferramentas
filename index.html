<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Galáxia com Azul Intenso e Sem Vermelho nas Bordas</title>
    <style>
        body {
            margin: 0;
            background-color: #000005;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const numStars = 4000;
        const arms = 5;
        const stars = [];

        const tiltAngle = Math.PI / 2.8;
        const cosTilt = Math.cos(tiltAngle);

        function createStar() {
            const initialDistance = Math.random() * canvas.width * 0.45;
            const armIndex = Math.floor(Math.random() * arms);
            const baseArmAngle = (armIndex / arms) * Math.PI * 2;
            const spin = initialDistance * 0.0035;
            const randomOffset = (Math.random() - 0.5) * 0.25;

            return {
                initialDistance: initialDistance,
                distance: initialDistance,
                maxDistance: Math.max(canvas.width, canvas.height) * 0.7,
                angle: baseArmAngle + spin + randomOffset,
                totalRotation: 0,
                targetRotation: Math.PI * 2 * (2 + Math.random() * 3),
                speed: (0.012 + (1 - initialDistance / (canvas.width * 0.45)) * 0.025),
                isDispersing: false,
                expansionRate: 1.5 + Math.random() * 2.0,
                size: Math.random() * 1.5 + 0.5,
                color: getStarColor(initialDistance)
            };
        }

        function getStarColor(distance) {
            if (distance < 50) return '#ffffff'; // Núcleo super quente
            if (distance < 140) return '#3399ff'; // Azul intermediário forte

            // Extremidades: apenas tons de azul intenso e ciano (sem vermelho)
            const intenseBlues = ['#00ffff', '#0088ff', '#1e90ff', '#00bfff', '#4169e1'];
            return intenseBlues[Math.floor(Math.random() * intenseBlues.length)];
        }

        for (let i = 0; i < numStars; i++) {
            const star = createStar();
            star.totalRotation = Math.random() * star.targetRotation;
            stars.push(star);
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Núcleo central incandescente (mantém o contraste quente no centro, mas limpo nas bordas)
            const coreGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 140);
            coreGradient.addColorStop(0, 'rgba(255, 255, 255, 1)');     // Centro branco puro
            coreGradient.addColorStop(0.2, 'rgba(255, 140, 50, 0.9)'); // Laranja central forte
            coreGradient.addColorStop(0.5, 'rgba(255, 50, 50, 0.4)');  // Vermelho apenas bem no miolo
            coreGradient.addColorStop(1, 'transparent');
            
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.scale(1, cosTilt);
            ctx.fillStyle = coreGradient;
            ctx.beginPath();
            ctx.arc(0, 0, 140, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Atualiza e desenha cada estrela
            stars.forEach((star, index) => {
                star.angle += star.speed;
                star.totalRotation += star.speed;

                if (star.totalRotation >= star.targetRotation) {
                    star.isDispersing = true;
                }

                if (star.isDispersing) {
                    star.distance += star.expansionRate;
                }

                const rawX = Math.cos(star.angle) * star.distance;
                const rawY = Math.sin(star.angle) * star.distance;

                const x = centerX + rawX;
                const y = centerY + (rawY * cosTilt);

                if (star.distance > star.maxDistance || x < 0 || x > canvas.width || y < 0 || y > canvas.height) {
                    stars[index] = createStar();
                } else {
                    if (star.isDispersing) {
                        ctx.fillStyle = '#ffffff'; // Clarão branco forte na fuga
                        ctx.fillRect(x, y, star.size * 1.8, star.size * 1.8);
                    } else {
                        ctx.fillStyle = star.color;
                        ctx.fillRect(x, y, star.size, star.size);
                    }
                }
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
